<section class="w-screen h-screen bg-[var(--bg-color)]" aria-labelledby="imprint-headline">
  <header>
    <!-- Header Bereich -->
    <app-login-header></app-login-header>
  </header>

  <main class="flex justify-center items-center h-[calc(100%-94px)] px-4">
    <!-- Main Content -->

    <div class="flex flex-col gap-8 bg-[var(--bg-box-color)] px-14 py-12 w-[676.27px] h-[469px] rounded-[30px] shadow-[0_4px_8px_0_rgba(0,0,0,0.2),0_6px_20px_0_rgba(0,0,0,0.10)]">
      <!-- Kontainer für die Impressum Box -->

      <div>
        <!-- Header Bereich für den Button -->
        <a routerLink="/" class="back_btn justify-self-start">
            <img class="back_btn" src="assets/svg/icons/icon_black/arrow_back_black.svg" alt="back_arrow">
        </a>
      </div>

      <div class="box__content flex flex-col gap-8 h-full">
        <!-- Haupt Bereich der Box wo sich die Impressum informationen und Überschriften befinden! -->
        <div class="box__text flex flex-col gap-4">
          <h2 id="imprint-headline" class="font-bold text-[var(--btn)] text-[46px]">Impressum</h2>
          <ul>
            <li class="select-text">
              [Student Names List]
            </li>
            <li class="select-text">
              [Address of the DABubble operator - e.g. one of the students]
              [Postcode and city]
            </li>
          </ul>
        </div>
        <div class="box__text flex flex-col gap-4">
          <h2 class="font-bold text-[var(--btn)] text-[32px]">Contact:</h2>
          <ul>
            <li class="select-text">
              Email: [Dein email]
            </li>
          </ul>
        </div>
      </div>
    </div>
  </main>
</section>
