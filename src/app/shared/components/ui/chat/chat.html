<div class="chat_history w-full flex-1 overflow-y-auto">
    <div class="separator flex items-center justify-center">
    </div>
    
    <div class="flex py-6 gap-8" [class.flex-row-reverse]="isOwnMessage()">
        <img class="size-[70px]" [src]="'assets/svg/avatar/avatar_small/' + (sender?.avatar || '1') + '.svg'" alt="avatar">
        <div class="flex flex-col gap-2">
            <div class="flex items-center gap-6" [class.flex-row-reverse]="isOwnMessage()">
                <span class="chat_name">{{sender?.name}}</span>
                <span class="timestamp">{{message.created_at | date:'HH:mm'}}</span>
            </div>
            <div [class]="isOwnMessage() ? 'message_user' : 'message_member'">
                <span>{{message.content}}</span>
            </div>
            <div class="flex gap-6 items-center" [class.flex-row-reverse]="isOwnMessage()">
                <!-- Member actions -->
                <span class="feedback" >2 Antworten</span>
            </div>
        </div>
    </div>
</div>
