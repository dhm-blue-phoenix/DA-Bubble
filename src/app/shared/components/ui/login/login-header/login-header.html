<section>
    <div class="content_beg flex flex-wrap justify-between items-center gap-2">
        <div class="flex items-center gap-2 md:gap-[16px]">
            <img src="assets/svg/logo/Logo.svg" alt="DaBubble-logo">
            <h2 class="text-black">DABubble</h2>
        </div>
    
        <div class="header_Display">
            @if (isLogingRoot){
                <div class="flex flex-col items-end gap-1 md:gap-2">
                    <span class="text-base md:text-base md:text-xl">Neu bei DABubble?</span>
                    <a class="text-[var(--link)] text-base md:text-base md:text-xl cursor-pointer" routerLink="/sign-in">Konto erstellen</a>
                </div>
            }
        </div>
    </div>
</section>
