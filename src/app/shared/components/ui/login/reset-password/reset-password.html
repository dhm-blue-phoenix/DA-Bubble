<div class="flex flex-col gap-[8px] md:gap-[30px] items-center">
    <div class="relative flex flex-col items-center w-full sm:flex-row">
        <a routerLink="/" class="static sm:absolute sm:left-0 back_btn" aria-label="Zurück zur Anmeldung">
            <img class="back_btn" src="assets/svg/icons/icon_black/arrow_back_black.svg" alt="">
        </a>
        <h2 class="w-full text-center">Passwort zurücksetzen</h2>
    </div>

    <form class="flex justify-center items-center flex-col w-full gap-[8px] md:gap-[30px]" (ngSubmit)="new_Password()">
        <div class="input_container flex items-center p-4 justify-between">
            <label class="sr-only" for="new-password">Neues Passwort</label>
            <input id="new-password" #pwRef="ngModel" name="new_password" required [(ngModel)]="new_password" class="py-2" type="password" autocomplete="new-password" placeholder="Neues Passwort">
        </div>
        <div class="input_container flex items-center p-4 justify-between">
            <label class="sr-only" for="repeat-new-password">Neues Passwort bestätigen</label>
            <input id="repeat-new-password" #pwRepeatRef="ngModel" name="reapead_new_password" required [(ngModel)]="reapead_new_password" class="py-2" type="password" autocomplete="new-password" placeholder="Neues Passwort bestätigen">
        </div>
        <div class="errorContainer">
            @if (password_match === false) {
                <span class="errorMassage">Passwörter stimmen nicht über ein.</span>
            }
        </div>

        <div class="flex w-full justify-end">
            <button [disabled]="pwRef.invalid || pwRepeatRef.invalid" class="btn_raw text-white bg-[var(--btn)]" type="submit">Password zurücksetzen</button>
        </div>
    </form>
</div>

<app-user-feedback [show]="show_feedback()">Passwort zurückgesetzt</app-user-feedback>
