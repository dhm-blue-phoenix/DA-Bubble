<section class="px-16 py-2 flex justify-between items-center">
    <div class="flex items-center gap-2">
        <img src="assets/svg/logo/Logo.svg" alt="DA-Bubble-logo">
        <h2>DABubble</h2>
        
    </div>

    <div>
        <div class="input_container flex items-center justify-between px-12 py-2">
            <input type="text" placeholder="Devspace durchsuchen" class="w-full" name="search" id="">
            <button><img class="size-[35px]" src="assets/svg/icons/icon_grey/search_grey.svg" alt=""></button>
        </div>
    </div>

    <div class="flex gap-2 items-center">
        <h2>{{ user.currentUser()?.name }}</h2>
        <div class="flex relative">
            <img class="size-[70px] " [src]='"assets/svg/avatar/avatar_small/" + (user.currentUser()?.avatar || "assets/svg/avatar/avatar_small/1") + ".svg"' alt="avatar">
            <div class="status_User online"></div>
        </div>
        <button (click)="toggle_Dialog()">
            <img class="size-[30px]" src="assets/svg/icons/icon_black/dropdown_black.svg" alt="">
        </button>
    </div>
    
</section>

    @if (dialog_open) {
        <div class="profil_overlay" (click)="toggle_Dialog()">
            <div (click)="$event.stopPropagation()" class="flex flex-col items-center bg-color-white profil_content justify-center gap-4">
                <button class="w-5/6"><span class="font-semibold text-2xl">Profil</span></button>
                <button class="w-5/6"><span class="font-semibold text-2xl" (click)="logout()">Log out</span></button>
            </div>
        </div>
    }


        <div class="profil_overlay" >
            <div (click)="$event.stopPropagation()" class="flex flex-col justify-start bg-color-white profile_Dialog justify-center gap-[32px] p-[42px]">

                <div class="flex items-center justify-between w-full">
                    <span class="text-2xl font-bold">Profil</span>
                    <button class="size-[24px]"><img src="assets/svg/icons/icon_black/close.svg" alt="close"></button>
                </div>

                <div class="w-full flex justify-center">
                    <img class="size-[200px]" [src]='"assets/svg/avatar/avatar_small/" + (user.currentUser()?.avatar || "assets/svg/avatar/avatar_small/1") + ".svg"' alt="avatar">
                </div>

                <div class="w-full flex justify-between">
                    <span class="text-3xl font-bold">{{ user.currentUser()?.name }}</span>
                    <button class="text-[20px] text-[var(--hover-text)] hover:font-bold">Bearbeiten</button>
                </div>

                <div class="justify-start w-full flex items-center gap-[16px]">
                    <div class="status_currentUser bg-[var(--status-online)]"></div>
                    <span class="text-xl text-[var(--status-online)]">Aktiv</span>
                </div>

                <div class="w-full flex items-center gap-[16px] justify-start">
                    <img class="size-[32px]" src="assets/svg/icons/icon_black/mail_black.svg" alt="email_icon">
                    <span class="font-bold text-xl">E-Mail-Adresse</span>
                </div>
                <div  class="w-full">
                    <a class="px-[48px] text-[20px] text-[var(--link-profile)]" href="#">{{ user.currentUser()?.email }}</a>
                </div>
            </div>
        </div>
