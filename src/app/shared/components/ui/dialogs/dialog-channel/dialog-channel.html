
<div class="p-10 flex flex-col gap-8">
    <div class="flex justify-between items-center">
        <div class="flex items-center gap-2">
            <span class="text-2xl font-bold">#</span>
            <span class="text-2xl font-bold">{{ channelInfo?.name }}</span>
        </div>
        <button (click)="closed.emit()" class="size-[40px] rounded-full flex items-center justify-center hover:bg-[var(--hover-bg)]"><img class="size-5" src="assets/svg/icons/icon_black/close.svg" alt=""></button>
    </div>

    <div class="flex flex-col gap-4" [class.border]="!editingName" [class.border-black/15]="!editingName" [class.rounded-2xl]="!editingName" [class.p-6]="!editingName">
        <div class="flex justify-between items-center">
            <span class="font-bold text-lg">Channel-Name</span>
            <button (click)="toggleEditName()" class="text-[var(--hover-text)] font-semibold hover:font-bold">{{ editingName ? 'Speichern' : 'Bearbeiten' }}</button>
        </div>
        @if (editingName) {
            <div class="border border-black/15 rounded-2xl px-4 py-3 flex items-center gap-2">
                <span class="text-lg">#</span>
                <input [(ngModel)]="nameDraft" name="channelName" type="text" placeholder="Channel-Name" class="text-lg outline-none w-full">
            </div>
        } @else {
            <div class="flex items-center gap-2">
                <span class="text-lg">#</span>
                <span class="text-lg">{{ channelInfo?.name }}</span>
            </div>
        }
    </div>

    <div class="flex flex-col gap-4" [class.border]="!editingDescription" [class.border-black/15]="!editingDescription" [class.rounded-2xl]="!editingDescription" [class.p-6]="!editingDescription">
        <div class="flex justify-between items-center">
            <span class="font-bold text-lg">Beschreibung</span>
            <button (click)="toggleEditDescription()" class="text-[var(--hover-text)] font-semibold hover:font-bold">{{ editingDescription ? 'Speichern' : 'Bearbeiten' }}</button>
        </div>
        @if (editingDescription) {
            <div class="border border-black/15 rounded-2xl px-4 py-3">
                <textarea [(ngModel)]="descriptionDraft" name="channelDescription" placeholder="Dein Text hier" class="text-black/70 outline-none w-full resize-none" rows="3"></textarea>
            </div>
        } @else {
            <div>
                <span class="text-black/70">{{ channelInfo?.description }}</span>
            </div>
        }
        <div class="w-full flex justify-center">
            <div class="separator border-t border-black/15 w-full"></div>
        </div>
    
        <div class="w-full flex flex-col gap-3">
            <span class="font-bold text-xl">Erstellt von</span>
            <span class="text-[var(--hover-text)] text-2xl font-bold">{{ channelCreator?.name }}</span>
        </div>
    </div>

    <div class="bg-white rounded-b-3xl w-full max-w-[720px] pb-10 flex justify-end">
        <button (click)="leave.emit()" class="btn_raw bg-[var(--highligh-color)] text-white font-bold">Channel verlassen</button>
    </div>
</div>
