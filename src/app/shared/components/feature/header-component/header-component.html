<section >
    <div class="content_beg lg:px-8 py-2 flex justify-between items-center">
        <div class="flex items-center gap-2 px-4">
            <img src="assets/svg/logo/Logo.svg" alt="DA-Bubble-logo">
            <h2>DABubble</h2>
            
        </div>

        <div class="relative flex-1 min-w-0">
            <div class="input_container w-full flex items-center justify-between px-12 py-2">
                <input #searchMsgInput type="text" autofocus [(ngModel)]="mention.text" (input)="mention.onInput(searchMsgInput)" (keyup)="onSearchFieldClick(searchMsgInput)" (click)="onSearchFieldClick(searchMsgInput)" name="searchMsg"type="text" placeholder="Devspace durchsuchen" class="w-full" name="search" id="">
                <button class="hover_btn"><img class="size-[32px]" src="assets/svg/icons/icon_grey/search_grey.svg" alt=""></button>

            </div>
            @if (mention.trigger()) {
                <app-selection-suggestions
                    [type]="mention.trigger()?.trigger === '#' ? 'channel' : 'member'"
                    [profiles]="mention.trigger() ? mention.profileSuggestions(true) : mention.emailSuggestions()"
                    [channels]="mention.channelSuggestions()"
                    (selectProfile)="onSelectProfile($event)"
                    (selectChannel)="onSelectChannel($event)">
                </app-selection-suggestions>
            }
            @else if (searchResults().length > 0) {
                <app-search-suggestions
                    [results]="searchResults()"
                    (select)="onSelectSearchResult($event)">
                </app-search-suggestions>
            }
        </div>

        <div class="flex gap-2 items-center px-4">
            <h2>{{ currentUser()?.name }}</h2>
            <div class="flex relative">
                <img class="size-[70px]" [src]='"assets/svg/avatar/avatar_small/" + (currentUser()?.avatar || "assets/svg/avatar/avatar_small/1") + ".svg"' alt="avatar">
                <div class="status_User" [class]="currentUser()?.status"></div>
            </div>
            <button (click)="toggle_Dialog()" class="hover_btn">
                <img class="size-[30px]" src="assets/svg/icons/icon_black/dropdown_black.svg" alt="">
            </button>
        </div>
    </div>

</section>

    <div class="search_Mobile p-4 w-full hidden justify-center">
        <input #searchMsgInput type="text" autofocus [(ngModel)]="mention.text" (input)="mention.onInput(searchMsgInput)" (keyup)="onSearchFieldClick(searchMsgInput)" (click)="onSearchFieldClick(searchMsgInput)" name="searchMsg"type="text" placeholder="Devspace durchsuchen" class="search_mobile_Input" name="search" id="">
    </div>

    @if (dialog_open) {
        <div class="profil_overlay" (click)="toggle_Dialog()">
            <div (click)="$event.stopPropagation()" class="flex flex-col items-center bg-color-white profil_content justify-center gap-4">
                <button class="w-5/6" (click)="openProfile()"><span class="font-semibold text-2xl">Profil</span></button>
                <button class="w-5/6" (click)="logout()"><span class="font-semibold text-2xl" >Log out</span></button>
            </div>
        </div>
    }
