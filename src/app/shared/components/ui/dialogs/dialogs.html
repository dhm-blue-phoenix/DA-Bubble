<section class="dialog_bg fixed inset-0 bg-black/50 flex flex-col items-center justify-center">
    <div class="dialog_content bg-white rounded-t-3xl w-full max-w-[720px]">
        @if(edit_dialog){
            <app-dialogchannel [channelInfo]="channelInfo" [channelCreator]="channelCreator" (closed)="closed.emit()" (save)="save.emit($event)" (leave)="leave.emit()"></app-dialogchannel>
        }
        @else if (add_channel) {
            <app-add-channel-dialog></app-add-channel-dialog> 
        }
        </div>
</section>
