
<div class="p-4 md:p-10 flex flex-col gap-4 md:gap-6 h-full lg:h-auto">
    <div class="flex justify-between items-center gap-2">
        <span class="text-xl md:text-2xl font-bold">Mitglieder</span>
        <button (click)="closed.emit()" class="size-9 md:size-[40px] shrink-0 hover_btn rounded-full flex items-center justify-center hover:bg-[var(--hover-bg)]">
            <img class="size-6 md:size-[32px]" src="assets/svg/icons/icon_black/close.svg" alt="">
        </button>
    </div>

    <div class="flex flex-col gap-1 overflow-y-auto max-h-[240px] scrollbar_Style">
        @for (member of memberProfiles; track member.id) {
            <button (click)="openProfile.emit(member)" class="flex items-center gap-3 px-2 py-2 rounded-2xl pointer hover:bg-[var(--hover-bg)] w-full min-w-0">
                <div class="relative size-10 md:size-[48px] shrink-0">
                    <img class="size-10 md:size-[48px] rounded-full" [src]="'assets/svg/avatar/avatar_small/' + (member.avatar || '1') + '.svg'" alt="avatar">
                    <div class="status" [class]="member.status"></div>
                </div>
                <span class="text-lg md:text-xl font-semibold truncate">{{ member.name }}{{ member.id === db.getCurrentUserId() ? ' (Du)' : '' }}</span>
            </button>
        }
    </div>

    <div class="w-full flex justify-center">
        <button (click)="addMember.emit()" class="flex hover_btn items-center gap-3 px-2 py-2 rounded-2xl hover:bg-[var(--hover-bg)] w-fit max-w-full">
            <div class="size-9 md:size-[40px] shrink-0 rounded-full bg-[var(--hover-bg)] flex items-center justify-center">
                <img class="size-6 md:size-[32px]" src="assets/svg/icons/icon_black/add_member_black.svg" alt="add_member">
            </div>
            <span class="text-base md:text-lg font-bold truncate">Mitglieder hinzufügen</span>
        </button>
    </div>
</div>
