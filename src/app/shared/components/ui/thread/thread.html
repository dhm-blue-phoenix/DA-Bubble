@if (rootMessage) {
    <app-chat [message]="rootMessage" [sender]="rootSender" context="thread"></app-chat>
    <div class="separator flex items-center justify-center"></div>
}

@for (item of messages; track item.message.id) {
    <app-chat [message]="item.message" [sender]="item.sender" context="thread"></app-chat>
}
