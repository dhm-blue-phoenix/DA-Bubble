
<div class="p-4 md:p-10 flex flex-col gap-4 md:gap-8 h-full lg:h-auto">
    <div class="flex justify-between items-center gap-2">
        <div class="flex items-center gap-4 min-w-0">
            <span class="text-xl md:text-2xl font-bold">Leute hinzufügen</span>
        </div>
        <button (click)="closed.emit()" class="size-9 md:size-[40px] shrink-0 rounded-full flex items-center justify-center hover:bg-[var(--hover-bg)]"><img class="size-5" src="assets/svg/icons/icon_black/close.svg" alt=""></button>
    </div>

    <div class="flex items-center gap-2 min-w-0">
        <span class="text-xl md:text-2xl font-bold text-[var(--hover-text)] shrink-0">#</span>
        <span class="text-xl md:text-2xl font-bold text-[var(--hover-text)] truncate">{{ channelInfo?.name }}</span>
    </div>

    <form class="flex flex-col gap-4">
        <div class="relative">
            <div class="border border-black/15 rounded-2xl px-2 md:px-4 py-2 md:py-3 flex items-center flex-wrap gap-2">
                @for (profile of selectedProfiles(); track profile.id) {
                    <span class="flex items-center gap-2 bg-[var(--hover-bg)] rounded-full px-3 md:px-6 py-1 md:py-2 max-w-full">
                        <img class="size-[24px] rounded-full shrink-0" [src]="'assets/svg/avatar/avatar_small/' + (profile.avatar || '1') + '.svg'" alt="avatar">
                        <span class="text-base font-semibold truncate">{{ profile.name }}</span>
                        <button type="button" (click)="removeSelected(profile)" class="flex items-center justify-center size-4 shrink-0 rounded-full hover:bg-black/10">
                            <img class="size-[24px]" src="assets/svg/icons/icon_black/close.svg" alt="entfernen">
                        </button>
                    </span>
                }
                <input [ngModel]="searchText()" (ngModelChange)="onSearchTextChange($event)" (keydown)="onKeydown($event)" name="memberName" type="text" placeholder="Name eingeben" class="text-lg outline-none flex-1 min-w-[120px]">
            </div>

            <app-selection-suggestions [profiles]="suggestions()" (selectProfile)="selectProfile($event)"></app-selection-suggestions>
        </div>

        <div class="bg-white rounded-b-3xl w-full pb-4 md:pb-10 flex justify-end">
            <button (click)="addMembers()" [disabled]="selectedProfiles().length === 0" class="btn_raw bg-[var(--highligh-color)] text-white font-bold">Hinzufügen</button>
        </div>
    </form>
</div>
