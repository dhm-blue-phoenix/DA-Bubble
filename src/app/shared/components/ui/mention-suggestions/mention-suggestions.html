@if (results.length > 0) {
    <ul class="mention_suggestions bg-white border border-black/15 rounded-tr-3xl rounded-b-3xl flex flex-col overflow-hidden shadow-lg">
        @for (profile of results; track profile.id) {
            <li>
                <button type="button" (click)="select.emit(profile)" class="w-full flex items-center gap-3 px-4 py-3 hover:bg-[var(--hover-bg)] text-left">
                    <div class="relative size-[48px]">
                        <img class="size-[48px] rounded-full" [src]="'assets/svg/avatar/avatar_small/' + (profile.avatar || '1') + '.svg'" alt="avatar">
                        <div class="status" [class]="profile.status"></div>
                    </div>
                    <span class="text-xl font-semibold">{{ profile.name }}</span>
                </button>
            </li>
        }
    </ul>
}
