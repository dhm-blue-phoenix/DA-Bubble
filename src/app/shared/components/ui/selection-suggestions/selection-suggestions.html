@if (type === 'member' && profiles.length > 0) {
    <ul class="selection_suggestions bg-white border border-black/15 flex flex-col scrollbar_Style overflow-x-hidden overflow-y-auto shadow-lg" [class.selection_suggestions_up]="direction === 'up'" [class.rounded-tr-3xl]="direction === 'down'" [class.rounded-b-3xl]="direction === 'down'" [class.rounded-br-3xl]="direction === 'up'" [class.rounded-t-3xl]="direction === 'up'">
        @for (profile of profiles; track profile.id; let i = $index) {
            <li>
                <button type="button" (click)="selectProfile.emit(profile)" [class]="'w-full flex items-center gap-3 px-4 py-3 hover:bg-[var(--hover-bg)] text-left '">
                    <div class="relative size-[48px]">
                        <img class="size-[48px] rounded-full" [src]="'assets/svg/avatar/avatar_small/' + (profile.avatar || '1') + '.svg'" alt="avatar">
                        <div class="status" [class]="profile.status"></div>
                    </div>
                    <span class="text-xl font-semibold">{{ profile.name }}</span>
                </button>
            </li>
        }
    </ul>
}
@else if (type === 'channel' && channels.length > 0) {
    <ul class="selection_suggestions bg-white border border-black/15 flex flex-col scrollbar_Style overflow-x-hidden overflow-y-auto shadow-lg" [class.selection_suggestions_up]="direction === 'up'" [class.rounded-tr-3xl]="direction === 'down'" [class.rounded-b-3xl]="direction === 'down'" [class.rounded-br-3xl]="direction === 'up'" [class.rounded-t-3xl]="direction === 'up'">
        @for (channel of channels; track channel.id; let i = $index) {
            <li>
                <button type="button" (click)="selectChannel.emit(channel)" [class]="'w-full flex items-center gap-3 px-4 py-3 hover:bg-[var(--hover-bg)] text-left '">
                    <span class="text-xl font-bold">#</span>
                    <span class="text-xl font-semibold">{{ channel.name }}</span>
                </button>
            </li>
        }
    </ul>
}
