<div class="chat_history w-full flex-1 overflow-y-auto">
    <div class="separator flex items-center justify-center">
    </div>
    
    <div class="chat_message group relative flex py-6 gap-2 cursor-pointer hover:bg-[var(--hover-bg)] my-2" [class.flex-row-reverse]="isOwnMessage()">
        <div class="reaction_bar absolute opacity-0 group-hover:opacity-100 transition bg-white border border-black/10 rounded-full shadow-md flex items-center gap-3 px-2 py-1" [class.right-4]="!isOwnMessage()" [class.left-4]="isOwnMessage()" [class.flex-row-reverse]="isOwnMessage()">
            @for (btn of [1,2,3,4]; track btn) {
                <button (click)="react(btn)" class="size-8 rounded-full flex items-center justify-center hover:bg-[var(--hover-bg)]">
                    <img [src]="'assets/svg/emoji/emoji' + btn + '.svg'" alt="reaction">
                </button>
            }
            <button class="size-8 rounded-full flex items-center justify-center hover:bg-[var(--hover-bg)]">
                    <img src="assets/svg/icons/icon_black/answer.svg" alt="reaction">
            </button>

            @if (isOwnMessage()) {
                <div class="relative group/menu">
                    <button class="size-10 rounded-full flex items-center justify-center hover:bg-[var(--hover-bg)]"><img src="assets/svg/icons/icon_black/menu.svg" alt=""></button>
                    <div class="absolute top-6 left-0 opacity-0 invisible group-hover/menu:opacity-100 group-hover/menu:visible transition">
                        <div class="edit_menu bg-white border border-black/10 rounded-tr-xl rounded-b-xl shadow-md whitespace-nowrap">
                            <button class="w-full text-left py-2 px-4 py-2 text-xl hover:bg-[var(--hover-bg)]">Nachricht bearbeiten</button>
                        </div>
                    </div>
                </div>
            }
        </div>
        <img class="size-[70px]" [src]="'assets/svg/avatar/avatar_small/' + (sender?.avatar || '1') + '.svg'" alt="avatar">
        <div class="flex flex-col gap-2">
            <div class="flex items-center gap-6" [class.flex-row-reverse]="isOwnMessage()">
                <span class="chat_name">{{sender?.name}}</span>
                <span class="timestamp">{{message.created_at | date:'HH:mm'}}</span>
            </div>
            <div [class]="isOwnMessage() ? 'message_user' : 'message_member'">
                <span>{{message.content}}</span>
            </div>

            @if (message.threads) {
                <div class="flex gap-6 items-center" [class.flex-row-reverse]="isOwnMessage()">
                    <button class="feedback">Antwort</button>
                </div>
            }
            @if (message.reactions && message.reactions.length > 0) {
                <div class="flex gap-2 items-center" [class.flex-row-reverse]="isOwnMessage()">
                    @for (reaction of message.reactions; track $index) {
                        <div class="reaction_bubble flex items-center gap-1 px-3 py-1">
                            <img class="size-5" [src]="'assets/svg/emoji/emoji' + reaction.emoji + '.svg'" alt="reaction">
                        </div>
                    }
                </div>
            }
        </div>
    </div>
</div>
